name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Outside services come from frontend/tests/fixtures/external; CI never calls Davidson, RMP or the feeds.
      EXTERNAL_MODE: fixtures
      # Keep the mongod binary used by unit/integration and e2e tests outside node_modules so it can be cached.
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - name: Cache MongoDB binaries
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - run: npm test

      # No secrets: the build must succeed without MONGODB_URI / NEXTAUTH_SECRET (they are read lazily at runtime).
      - run: npm run build

      # Type floor (no font size below 12px) and CSS budget (< 80 KB gzipped) on the built stylesheets.
      - run: npm run check:css

      # First-load JS budget (< 200 KB gzipped) on the key pages, with temporary ceilings for the ones still over.
      - run: npm run check:js

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          # Reuse the build from the previous step.
          E2E_SKIP_BUILD: "1"

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
